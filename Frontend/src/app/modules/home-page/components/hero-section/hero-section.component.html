<div class="hero flex flex-col w-full pt-10 px-10 h-screen justify-between items-center">
  <div class="star-field" aria-hidden="true">
    <canvas #starCanvas></canvas>
    <span class="shooting-star shooting-star--1"></span>
    <span class="shooting-star shooting-star--2"></span>
    <span class="shooting-star shooting-star--3"></span>
  </div>
  <div class="w-1/3 relative left-14 aspect-square">
    <img ngSrc="assets/new-logo-bigger-glow.png" priority alt="Stern Screenplays Logo" fill>
  </div>
  <h2 [innerHTML]="'home-page.our-direction' | translate" class="mb-10"></h2>
  <div class="scroll-indicator" [style.opacity]="showScrollIndicator() ? 1 : 0">
    <p-message severity="secondary" variant="simple" size="large">{{'home-page.scroll-info-message' | translate}}</p-message>
    <i style="font-size: 1rem" class="pi pi-arrow-down animate-bounce"></i>
  </div>
</div>
